<!doctype html>
{% comment %}
    Eldritch York documents: found transcripts, logs, records.
    Optional front matter: body_class (added alongside "eldritch-york").
{% endcomment %}
<html>
    <head>
        {% include favicon.html %}
        <meta charset="utf-8">
        <title>{{ page.title }}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Homemade+Apple&display=swap">
        <link rel="stylesheet" href="/assets/css/styles.css">
    </head>
    <body class="eldritch-york{% if page.body_class %} {{ page.body_class }}{% endif %}">
        {% include navigation.html %}
        <section class="content">
            <article id="page">
                {{ content }}
            </article>
        </section>
        {% include disclaimer.html %}
        <script src="/assets/js/footnote-popups.js" defer></script>
    </body>
</html>
